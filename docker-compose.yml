services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleetdesk
      POSTGRES_USER: fleetdesk
      POSTGRES_PASSWORD: fleetdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetdesk -d fleetdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api/FleetDesk.Api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=fleetdesk;Username=fleetdesk;Password=fleetdesk
      Jwt__Key: ${JWT_KEY:-compose-dev-key-compose-dev-key-0123456789}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@fleetdesk.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-ChangeMe123!}
      Cors__Origins__0: http://localhost:4200
    ports:
      - "5080:8080"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  pgdata:
